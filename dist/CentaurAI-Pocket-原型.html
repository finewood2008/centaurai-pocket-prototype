:root {
  /* ---------- 纸与墨（Anthropic ivory / cloud / ink） ---------- */
  --color-background: #FAF9F5;        /* ivory light */
  --color-background-raised: #F0EEE6; /* cloud */
  --color-surface: #FFFFFF;
  --color-surface-soft: #F5F4ED;
  --color-surface-highlight: #EBE9DF;
  --color-border: #DFDBCE;
  --color-border-soft: #EAE7DC;
  --color-text: #141413;              /* ink，对纸底 ≈18:1 */
  --color-text-muted: #5F5E58;        /* 6.17:1 ✓ 正文级 */
  --color-text-dim: #91918D;          /* 3.03:1 —— 只作 ≤11px 提示，不承载可点文案 */

  /* ---------- Claude 橙：主色 ---------- */
  /* primary 是填充/描边/进度色；对纸底只有 ~2.9:1，**不承载文字** */
  --color-primary: #D97757;
  /* primaryFill 是主按钮的底色：还看得出是 Claude 橙，白字 4.79:1 ✓ 刚好过 AA */
  --color-primary-fill: #B85536;
  /* primaryDark 是承载文字的那一档：对纸底 5.56:1、在 primarySoft 上 5.13:1 ✓ */
  --color-primary-dark: #A6472A;
  --color-primary-soft: #FBEDE7;
  --color-primary-border: #F0D5C7;

  /* ---------- kraft 赭 / manilla：提醒与高亮 ---------- */
  /* gold 同样只做填充与描边（在 goldSoft 上仅 ~2.9:1） */
  --color-gold: #D4A27F;
  --color-gold-dark: #8A5A32;         /* 在 goldSoft 上 4.89:1 ✓ 承载文字用这个 */
  --color-gold-soft: #F5EADA;

  /* 以下四组是 apps/mobile/src/theme/colors.ts 里的别名，照留不删：
     feature screens 直接消费它们，留着才能和 App 逐行 diff */
  --color-violet: #8A5A32;
  --color-violet-soft: #F5EADA;
  --color-blue: #D97757;
  --color-blue-soft: #FBEDE7;
  --color-info: #D97757;
  --color-info-soft: #FBEDE7;
  --color-warning: #8A5A32;
  --color-warning-soft: #F5EADA;

  --color-danger: #B3402C;            /* 在 dangerSoft 上 4.67:1 ✓ */
  --color-danger-soft: #F8E5DF;
  --color-success: #4C6B4F;           /* 对纸底 ≈5.4:1 ✓ */
  --color-success-soft: #E8EEE6;
  --color-white: #FFFFFF;
  --color-black: #000000;

  /* ---------- 圆角：Claude 的界面比金石松一档 ---------- */
  /* 仍守「圆角 ≤ 内边距」：Notice 10/13、Button 10/16、card 16/16、metric 16/17 */
  --radius-small: 6px;
  --radius-medium: 10px;
  --radius-large: 16px;
  --radius-pill: 999px;

  /* ---------- 阴影：只留一口气 ---------- */
  --shadow-card: 0 2px 4px rgba(20, 20, 19, 0.05);

  /* ---------- 字体：系统回退，不引任何外链 CDN ---------- */
  /* Claude 的 Styrene / Copernicus 不可分发，用系统栈近似：
     无衬线走 PingFang SC 系，衬线走 Songti / Noto Serif 系。
     serif 栈必须以关键字 serif 结尾 —— Songti SC 在 Linux 上会掉成无衬线，需要兜底。 */
  --font-sans: "PingFang SC", "Noto Sans CJK SC", "Noto Sans SC", "Microsoft YaHei",
    "Heiti SC", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --font-serif: "Songti SC", "Noto Serif CJK SC", "Noto Serif SC", "SimSun", "STSong",
    Georgia, serif;

  /* ---------- 布局常量（screen.tsx / (tabs)/_layout.tsx） ---------- */
  --pad-screen-x: 16px;
  --pad-screen-top: 16px;
  --pad-screen-bottom: 96px; /* ≈ tabbar 60 + inset 34 */
  --gap-screen: 16px;
  --tabbar-h: 60px;
  --safe-top: 47px;    /* 390×844 = iPhone 12/13/14 */
  --safe-bottom: 34px;

  /* ---------- 设备尺寸 ---------- */
  --device-w: 390px;
  --device-h: 844px;
}

/* ===== styles/base.css ===== */
/* base.css —— reset、排版基线、滚动行为 */

*,
*::before,
*::after {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
}

body {
  background: var(--color-background-raised);
  color: var(--color-text);
  font-family: var(--font-sans);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

h1,
h2,
h3,
h4,
p,
figure {
  margin: 0;
}

ul,
ol {
  margin: 0;
  padding: 0;
  list-style: none;
}

button {
  font: inherit;
  color: inherit;
  border: 0;
  background: none;
  padding: 0;
  cursor: pointer;
}

input,
textarea,
select {
  font: inherit;
  color: inherit;
}

a {
  color: var(--color-primary-dark);
  text-decoration: none;
}

/* 手机内的滚动条不显示，避免和真机观感不符 */
.no-scrollbar {
  scrollbar-width: none;
  -ms-overflow-style: none;
}

.no-scrollbar::-webkit-scrollbar {
  display: none;
}

/* 衬线体只用于标题与字标，正文一律无衬线 */
.serif {
  font-family: var(--font-serif);
}

.visually-hidden {
  position: absolute;
  width: 1px;
  height: 1px;
  margin: -1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
  border: 0;
}

/* ============================================================
 * components.css —— apps/mobile/src/components/ui.tsx 的 HTML 版
 *
 * 结构与取值逐条对照 git show origin/main:apps/mobile/src/components/ui.tsx；
 * 颜色与圆角改用 Claude 官方配色（见 tokens.css 顶部说明）。
 * 两条硬约束（实测对比度，可逐条验算）：
 *   1) Claude 橙 --color-primary 与 kraft --color-gold 都只做 border/background ——
 *      它们在自己的 soft 底上都不到 3:1。承载文字用 --color-primary-dark

 *      主按钮底色用 --color-primary-fill（白字 4.79:1）。CSS 里不得出现
 *      `color: var(--color-gold)` 或 `color: var(--color-primary)` 作文字色。
 *      --color-text-dim 对纸底 3.03:1，只作 ≤11px 提示，不用于可点文案。
 *   2) 圆角 ≤ 内边距（Notice 10/13、EmptyState 16/24、Button 10/16、card 16/16）。

/* ---------- BrandHeader（screen.tsx） ---------- */

.brand-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
}

.brand-header__lead {
  display: flex;
  flex: 1;
  min-width: 0;
  align-items: flex-start;
  gap: 12px;
}

.brand-header__copy {
  display: flex;
  flex-direction: column;
  flex: 1;
  min-width: 0;
  gap: 4px;
}

.eyebrow {
  color: var(--color-primary-dark);

  font-weight: 600;

  line-height: 15px;
}

.screen-title {
  color: var(--color-text);

.screen-subtitle {

  font-size: 13px;
  line-height: 20px;

.brand-mark {
  --mark: 44px;
  display: block;
  flex-shrink: 0;
  width: auto;
  height: var(--mark);
  max-width: calc(var(--mark) * 0.86);
  object-fit: contain;
  object-position: bottom center;
}

.brand-lockup {
  display: flex;
  align-items: center;
  gap: 9px;
  flex-shrink: 0;
}

.brand-wordmark {
  font-family: var(--font-serif);
  font-size: 15px;
  font-weight: 700;
  line-height: 20px;
  letter-spacing: 0.5px;
  color: var(--color-text);
  white-space: nowrap;
}

/* ---------- SectionHeader ---------- */

.section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.section-header__copy {
  display: flex;
  flex-direction: column;
  flex: 1;
  gap: 3px;
}

.section-title {
  color: var(--color-text);
  font-family: var(--font-serif);
  font-size: 18px;
  font-weight: 600;
  line-height: 24px;
}

.section-caption {
  color: var(--color-text-muted);
  font-size: 12px;
  line-height: 18px;
}

/* ---------- Pill ---------- */

.pill {
  display: inline-block;
  align-self: flex-start;
  border-radius: var(--radius-pill);
  border: 1px solid var(--color-border);
  background: var(--color-surface);
  color: var(--color-text-muted);
  padding: 4px 10px;
  font-size: 11px;
  font-weight: 600;
  line-height: 16px;
  white-space: nowrap;
}

.pill--primary {
  background: var(--color-primary-soft);
  border-color: var(--color-primary-border);
  color: var(--color-primary-dark);
}

.pill--warning {
  background: var(--color-warning-soft);
  border-color: var(--color-gold);
  color: var(--color-warning);
}

.pill--danger {
  background: var(--color-danger-soft);
  border-color: var(--color-danger);
  color: var(--color-danger);
}

.pill--violet {
  background: var(--color-gold-soft);
  border-color: var(--color-gold);
  color: var(--color-violet);
}

.pill--success {
  background: var(--color-success-soft);
  border-color: var(--color-success);
  color: var(--color-success);
}

/* ---------- Notice ---------- */

.notice {
  display: flex;
  align-items: center;
  gap: 10px;
  border: 1px solid var(--color-primary-border);
  background: var(--color-primary-soft);
  border-radius: var(--radius-medium);
  padding: 13px;
}

.notice--warning {
  border-color: var(--color-gold);
  background: var(--color-warning-soft);
}

.notice--danger {
  border-color: var(--color-danger);
  background: var(--color-danger-soft);
}

.notice__icon {
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  width: 28px;
  height: 28px;
  border-radius: 14px;
  background: var(--color-surface);
  border: 1px solid var(--color-border-soft);
  color: var(--color-text);
  font-size: 17px;
  font-weight: 700;
}

.notice__copy {
  display: flex;
  flex-direction: column;
  flex: 1;
  gap: 3px;
  min-width: 0;
}

.notice__title {
  color: var(--color-text);
  font-size: 13px;
  font-weight: 600;
}

.notice__message {
  color: var(--color-text-muted);
  font-size: 12px;
  line-height: 18px;
}

/* ---------- EmptyState ---------- */

.empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 9px;
  border-radius: var(--radius-large);
  border: 1px solid var(--color-border-soft);
  background: var(--color-surface);
  padding: 24px;
  box-shadow: var(--shadow-card);
}

.empty__icon {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 48px;
  height: 48px;
  border-radius: 24px;
  background: var(--color-primary-soft);
  border: 1px solid var(--color-primary-border);
  color: var(--color-primary-dark);
  font-size: 22px;
  font-weight: 700;
  margin-bottom: 4px;
}

.empty__title {
  color: var(--color-text);
  font-family: var(--font-serif);
  font-size: 17px;
  font-weight: 600;
}

.empty__message {
  color: var(--color-text-muted);
  font-size: 13px;
  line-height: 20px;
  text-align: center;
}

/* ---------- Button ---------- */

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  min-height: 44px;
  border-radius: var(--radius-medium);
  padding: 0 16px;
  font-size: 14px;
  font-weight: 600;
  background: var(--color-primary-fill);
  color: var(--color-white);
  transition: opacity 0.12s ease, transform 0.12s ease;
}

.btn:active {
  opacity: 0.86;
  transform: scale(0.99);
}

.btn--block {
  width: 100%;
}

.btn--compact {
  min-height: 36px;
  border-radius: var(--radius-small);
  padding: 0 12px;
}

.btn--secondary {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  color: var(--color-text);
}

.btn--ghost {
  background: transparent;
  color: var(--color-text-muted);
}

.btn--danger {
  background: var(--color-danger-soft);
  border: 1px solid var(--color-danger);
  color: var(--color-danger);
}

.btn[disabled],
.btn--disabled {
  opacity: 0.45;
  cursor: not-allowed;
}

.btn__icon {
  font-size: 16px;
  font-weight: 700;
}

/* ---------- LoadingCards ---------- */

.loading-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.loading-card {
  display: flex;
  flex-direction: column;
  gap: 12px;
  height: 136px;
  border-radius: var(--radius-large);
  padding: 16px;
  background: var(--color-surface);
  border: 1px solid var(--color-border-soft);
  box-shadow: var(--shadow-card);
}

.skeleton {
  height: 12px;
  border-radius: 6px;
  background: var(--color-surface-soft);
}

.skeleton--short { width: 28%; }
.skeleton--medium { width: 60%; }
.skeleton--long { width: 92%; height: 20px; }

/* ============================================================
 * 以下是屏幕层反复出现的卡片与行样式。
 * 全部遵守「圆角 ≤ 内边距」。
 * ============================================================ */

.card {
  border-radius: var(--radius-large);
  border: 1px solid var(--color-border-soft);
  background: var(--color-surface);
  padding: 16px;
  box-shadow: var(--shadow-card);
}

.card--hero {
  padding: 20px;
}

.card--flat {
  box-shadow: none;
}

.card--quiet {
  background: var(--color-surface-soft);
  border-color: var(--color-border);
  box-shadow: none;
}

.stack {
  display: flex;
  flex-direction: column;
  gap: var(--gap-screen);
}

.stack--tight { gap: 10px; }
.stack--snug { gap: 12px; }
.stack--loose { gap: 20px; }

.row {
  display: flex;
  align-items: center;
  gap: 10px;
}

.row--between {
  justify-content: space-between;
}

.row--wrap {
  flex-wrap: wrap;
}

.row--top {
  align-items: flex-start;
}

.grow { flex: 1; min-width: 0; }

/* ---------- 文字级别 ---------- */

.t-label {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.6px;
  color: var(--color-text-muted);
}

.t-body {
  font-size: 13px;
  line-height: 20px;
  color: var(--color-text);
}

.t-muted {
  font-size: 12px;
  line-height: 18px;
  color: var(--color-text-muted);
}

.t-dim {
  font-size: 11px;
  line-height: 16px;
  color: var(--color-text-dim);
}

.t-strong {
  font-weight: 600;
  color: var(--color-text);
}

.t-serif-lg {
  font-family: var(--font-serif);
  font-size: 20px;
  font-weight: 600;
  line-height: 27px;
  color: var(--color-text);
}

.t-num {
  font-family: var(--font-serif);
  font-size: 40px;
  font-weight: 600;
  line-height: 46px;
  letter-spacing: -1px;
  color: var(--color-text);
}

.t-num--sm {
  font-size: 22px;
  line-height: 28px;
  letter-spacing: -0.4px;
}

.t-mono {
  font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  font-size: 12px;
  color: var(--color-text-muted);
  word-break: break-all;
}

/* ---------- 三格指标（metric 12/17） ---------- */

.metric-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}

.metric {
  border-radius: var(--radius-large);
  padding: 17px 12px;
  background: var(--color-surface-soft);

    BackBar: function (o) {

        '<button type="button" class="backbar" data-back="1">' +

        '<div class="stack stack--tight">' +
        '<h1 class="screen-title">' + esc(o.title) + "</h1>" +

      );
    },

    SectionHeader: function (o) {
      return (
        '<div class="section-header"' + api(o.apiKey) + ">" +
        '<div class="section-header__copy">' +
        '<h2 class="section-title">' + esc(o.title) + "</h2>" +
        (o.caption ? '<p class="section-caption">' + esc(o.caption) + "</p>" : "") +
        "</div>" +
        (o.action || "") +
        "</div>"
      );
    },

    Pill: function (o) {
      var tone = o.tone && o.tone !== "neutral" ? " pill--" + o.tone : "";
      return '<span class="pill' + tone + '">' + esc(o.label) + "</span>";
    },

    Notice: function (o) {
      var tone = o.tone && o.tone !== "primary" ? " notice--" + o.tone : "";
      var glyph = o.tone === "danger" ? "!" : o.tone === "warning" ? "↻" : "·";
      return (
        '<div class="notice' + tone + '"' + api(o.apiKey) + ">" +
        '<span class="notice__icon" aria-hidden="true">' + glyph + "</span>" +
        '<div class="notice__copy">' +
        '<p class="notice__title">' + esc(o.title) + "</p>" +
        '<p class="notice__message">' + esc(o.message) + "</p>" +
        "</div>" +
        (o.action || "") +
        "</div>"
      );
    },

    EmptyState: function (o) {
      return (
        '<div class="empty"' + api(o.apiKey) + ">" +
        '<span class="empty__icon" aria-hidden="true">' + esc(o.symbol || "✓") + "</span>" +
        '<p class="empty__title">' + esc(o.title) + "</p>" +
        '<p class="empty__message">' + esc(o.message) + "</p>" +
        (o.action || "") +
        "</div>"
      );
    },

    Button: function (o) {
      var cls = "btn";
      if (o.tone && o.tone !== "primary") cls += " btn--" + o.tone;
      if (o.compact) cls += " btn--compact";
      if (o.block) cls += " btn--block";
      if (o.disabled) cls += " btn--disabled";
      return (
        '<button type="button" class="' + cls + '"' +
        api(o.apiKey) +
        goAttrs(o) +
        (o.disabled ? " disabled" : "") +
        ">" +
        (o.icon ? '<span class="btn__icon" aria-hidden="true">' + esc(o.icon) + "</span>" : "") +
        esc(o.label) +
        "</button>"
      );
    },

    LoadingCards: function (count) {
      var n = count || 3;
      var out = '<div class="loading-list">';
      for (var i = 0; i < n; i++) {
        out +=
          '<div class="loading-card">' +
          '<div class="skeleton skeleton--short"></div>' +
          '<div class="skeleton skeleton--long"></div>' +
          '<div class="skeleton skeleton--medium"></div>' +
          "</div>";
      }
      return out + "</div>";
    },

    /* ---------- 屏幕层复用件 ---------- */

    Row: function (o) {
      var attrs = o.go || o.sheet || o.toast ? goAttrs(o) : "";
      var tag = attrs ? "button" : "div";
      var typeAttr = attrs ? ' type="button"' : "";
      return (
        "<" + tag + ' class="list__row"' + typeAttr + attrs + api(o.apiKey) + ">" +
        (o.lead || "") +
        '<span class="grow">' +
        '<span class="t-body t-strong" style="display:block">' + esc(o.title) + "</span>" +
        (o.caption ? '<span class="t-muted" style="display:block">' + esc(o.caption) + "</span>" : "") +
        "</span>" +
        (o.trailing || "") +
        (attrs ? '<span class="list__chevron" aria-hidden="true">›</span>' : "") +
        "</" + tag + ">"
      );
    },

    List: function (rows, apiKey) {
      return '<div class="list"' + api(apiKey) + ">" + rows.join("") + "</div>";
    },

    Metric: function (o) {
      return (
        '<div class="metric">' +
        '<div class="metric__value">' + esc(o.value) + "</div>" +
        '<div class="metric__label">' + esc(o.label) + "</div>" +
        "</div>"
      );
    },

    Progress: function (pct, gold) {
      var v = Math.max(0, Math.min(100, Number(pct) || 0));
      return (
        '<div class="progress" role="progressbar" aria-valuenow="' + v +
        '" aria-valuemin="0" aria-valuemax="100">' +
        '<div class="progress__fill' + (gold ? " progress__fill--gold" : "") +
        '" style="width:' + v + '%"></div></div>'
      );
    },

    Dot: function (tone, label) {
      return (
        '<span class="row" style="gap:6px">' +
        '<span class="dot dot--' + esc(tone) + '" aria-hidden="true"></span>' +
        '<span class="t-muted">' + esc(label) + "</span></span>"
      );
    },

    Segmented: function (o) {
      var items = o.items
        .map(function (it) {
          return (
            '<button type="button" class="segmented__item" role="tab" aria-selected="' +
            (it.selected ? "true" : "false") + '"' +
            goAttrs({ go: o.go, view: it.id }) +
            ">" + esc(it.label) +
            (it.count === undefined ? "" : ' <span class="t-dim">' + esc(it.count) + "</span>") +
            "</button>"
          );
        })
        .join("");
      return '<div class="segmented" role="tablist"' + api(o.apiKey) + ">" + items + "</div>";

    Field: function (o) {
      if (o.multiline) {
        return (
          '<label class="field field--textarea">' +
          '<textarea class="field__input" placeholder="' + esc(o.placeholder || "") + '"' +
          (o.readonly ? " readonly" : "") + ">" + esc(o.value || "") + "</textarea></label>"
        );
      }
      return (
        '<label class="field">' +
        (o.icon ? '<span class="field__icon" aria-hidden="true">' + esc(o.icon) + "</span>" : "") +
        '<input class="field__input" type="' + esc(o.type || "text") +
        '" placeholder="' + esc(o.placeholder || "") +
        '" value="' + esc(o.value || "") + '"' +
        (o.readonly ? " readonly" : "") + " />" +
        (o.trailing || "") +
        "</label>"
      );

    Chip: function (label, on) {
      return '<span class="chip' + (on ? " chip--on" : "") + '">' + esc(label) + "</span>";

    Diff: function (o) {
      return (
        '<div class="diff">' +

    Card: function (o) {

  /* ---------- 格式化：一律相对固定的 NOW，保证截图可复现 ---------- */
  var NOW_MS = Date.parse("2026-08-17T09:41:00Z");

  P.fmt = {
    now: "2026-08-17T09:41:00Z",

    rel: function (iso) {
      if (!iso) return "从未";
      var d = Date.parse(iso);
      var min = Math.round((NOW_MS - d) / 60000);
      if (min < 1) return "刚刚";
      if (min < 60) return min + " 分钟前";
      var h = Math.round(min / 60);
      if (h < 24) return h + " 小时前";
      var day = Math.round(h / 24);
      if (day === 1) return "昨天";
      if (day < 30) return day + " 天前";
      return iso.slice(0, 10);
    },

    ahead: function (iso) {
      if (!iso) return "无计划";
      var min = Math.round((Date.parse(iso) - NOW_MS) / 60000);
      if (min <= 0) return "即将开始";
      if (min < 60) return min + " 分钟后";
      var h = Math.round(min / 60);
      if (h < 24) return h + " 小时后";
      return iso.slice(0, 10);
    },

    clock: function (iso) {
      if (!iso) return "—";
      return iso.slice(11, 16);
    },

    date: function (iso) {
      if (!iso) return "—";
      return Number(iso.slice(5, 7)) + " 月 " + Number(iso.slice(8, 10)) + " 日";
    },

    gb: function (bytes) {
      if (!bytes) return "0 GB";
      var g = bytes / 1073741824;
      return (g >= 100 ? Math.round(g) : g.toFixed(1)) + " GB";
    },

    /* 指标格里用的短版：去掉「后」「前」，避免 19px 的值在 110px 宽的格子里折行 */
    aheadShort: function (iso) {
      return P.fmt.ahead(iso).replace(/后$/, "");
    },

    relShort: function (iso) {
      return P.fmt.rel(iso).replace(/前$/, "");
    },

    pct: function (n) {
      return Math.round(Number(n) || 0) + "%";
    }
  };

  P.ui = ui;
})((window.Pocket = window.Pocket || {}));

    <script>
/* ===== scripts/screens/today.js ===== */
/* ============================================================
 * 今日 —— product-spec.md §3.1：首页必须在一个请求内回答四个问题，
 * 并且**只提供一个主行动**。
 *
 * 现有 App 放了两张同级 action card（清理收件箱 + 快速采集），违反这一条；
 * 这里把采集降级为品牌头右上角的 +。
 * ============================================================ */
(function (P) {
  "use strict";

  var ui = P.ui;
  var fmt = P.fmt;

  var KIND_LABEL = {
    duplicate: "疑似重复",
    classify: "智能分类",
    quality: "质量补全",
    normalize: "格式规范",
    deletion: "源文件已删除",
    review: "需要确认",
    knowledge: "新知识候选",
    source: "新信源"
  };

  P.SCREENS.today = {
    title: "今日",
    tab: "today",
    kind: "tab",
    api: [
      "GET /dashboard",
      "GET /governance/inbox/summary",
      "GET /box/status",
      "GET /sources"
    ],
    reads: [
      "GET /dashboard|body.ready_items",
      "GET /dashboard|body.quality_score",
      "GET /dashboard|body.items.needs_review",
      "GET /dashboard|body.sync.discovered_today",
      "GET /dashboard|body.sync.deduplicated_today",
      "GET /dashboard|body.sources.healthy",
      "GET /dashboard|body.sources.total",
      "GET /dashboard|body.next_task.title",
      "GET /dashboard|body.next_task.kind",
      "GET /dashboard|body.recent_activity[0].message",
      "GET /governance/inbox/summary|body.pending_total",
      "GET /governance/inbox/summary|body.by_queue.governance",
      "GET /box/status|body.display_name"
    ],

    render: function (snap, route) {
      var dash = snap.get("GET /dashboard");
      var summary = snap.get("GET /governance/inbox/summary");
      var box = snap.get("GET /box/status");

      var header = ui.BrandHeader({
        eyebrow: "半人马AI · POCKET",
        title: "今日",
        subtitle: fmt.date(fmt.now) + " · " + (box.state === "ok" ? box.body.display_name : "未连接"),
        trailing:
          '<button type="button" class="btn btn--secondary btn--compact" data-sheet="capture" ' +
          'aria-label="采集一段文字或链接">＋</button>'
      });

      /* ---- 加载态：骨架，不闪空数字 ---- */
      if (dash.state === "loading") {
        return header + ui.LoadingCards(3);
      }

      /* ---- 盒子连不上：整页接管，一个数字都不显示 ---- */
      if (dash.state === "error") {
        return (
          header +
          ui.Notice({
            tone: "danger",
            title: "连不上你的盒子",
            message:
              dash.detail +
              "。最近一次连接成功是 " + fmt.rel(dash.last_success_at) +
              "。这里不显示任何数字，避免把旧数据当成现状。",
            apiKey: "GET /dashboard"
          }) +
          ui.Card({
            body:
              '<div class="stack stack--snug">' +
              '<p class="t-body">你的数据都在盒子上，手机只是它的控制台 —— 连不上时不会有任何数据丢失。</p>' +
              '<div class="action-bar">' +
              ui.Button({ label: "重试", go: "/today" }) +
              ui.Button({ label: "检查连接", tone: "secondary", go: "/box/connection" }) +
              "</div></div>"
          })
        );
      }

      var d = dash.body;
      var s = summary.body;

      /* ---- 刚装好、还没有来源 ---- */
      if (d.sources.total === 0) {
        return (
          header +
          ui.EmptyState({
            symbol: "▤",
            title: "你的底座还是空的",
            message:
              "加一个文件夹，盒子会开始扫描、去重、规范化，" +
              "只把治理干净的数据开放给 Agent。",
            action: ui.Button({ label: "添加第一个数据来源", sheet: "add-source" }),
            apiKey: "GET /sources"
          })
        );
      }

      /* ---- Hero：一次答完四问 ---- */
      var hero = ui.Card({
        hero: true,
        apiKey: "GET /dashboard",
        body:
          '<div class="stack stack--snug">' +
          '<div class="row row--between row--top">' +
          '<div class="grow">' +
          '<div class="t-num">' + d.ready_items + "</div>" +
          '<p class="t-muted">条已治理完成，个人 Agent 现在能查到</p>' +
          "</div>" +
          ui.Pill({ label: "治理度 " + fmt.pct(d.quality_score), tone: "primary" }) +
          "</div>" +
          ui.Progress(d.quality_score) +
          '<p class="t-dim">治理度＝已就绪 ÷（已就绪＋待确认），不含已归档</p>' +
          '<div class="metric-grid">' +
          ui.Metric({
            value: d.sources.healthy + "/" + d.sources.total,
            label: d.sources.attention ? "来源要看 " + d.sources.attention : "来源正常"
          }) +
          ui.Metric({ value: "+" + d.sync.discovered_today, label: "今天新增" }) +
          ui.Metric({ value: s.pending_total, label: "等你判断" }) +
          "</div>" +
          '<p class="t-dim">今天去重 ' + d.sync.deduplicated_today +
          " 条 · 已处理 " + d.processed_today +
          " 条 · 上次同步 " + fmt.rel(d.last_sync_at) + "</p>" +
          "</div>"
      });

      /* ---- 唯一主行动 ---- */
      var action;
      if (s.pending_total === 0) {
        action = ui.EmptyState({
          symbol: "✓",
          title: "今天没有需要你判断的事",
          message:
            "盒子会继续自动同步和去重。有需要你拿主意的，会出现在这里。",
          action: ui.Button({ label: "看看 Agent 能查到什么", tone: "secondary", go: "/data", view: "agent" }),
          apiKey: "GET /governance/inbox/summary"
        });
      } else {
        var nt = d.next_task;
        action = ui.Card({
          apiKey: "GET /governance/tasks/next",
          body:
            '<div class="stack stack--snug">' +
            ui.Button({ label: "处理下一条", block: true, go: "/governance" }) +
            '<div class="row" style="gap:8px">' +
            ui.Pill({ label: KIND_LABEL[nt.kind] || nt.kind, tone: nt.kind === "deletion" ? "danger" : "violet" }) +
            '<span class="t-muted grow" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' +
            ui.esc(nt.title) +
            "</span></div>" +
            '<p class="t-dim">还有 ' + s.pending_total + " 条：治理任务 " + s.by_queue.governance +
            " · 知识候选 " + (s.by_queue.knowledge_candidates || 0) +
            " · 信源候选 " + (s.by_queue.reliable_source_candidates || 0) + "</p>" +
            "</div>"
        });
      }

      /* ---- 异常带：最多两条，按严重度 ---- */
      var alerts = [];
      var sources = snap.get("GET /sources");
      if (sources.state === "ok") {
        sources.body.items.forEach(function (src) {
          if (alerts.length >= 2) return;
          if (src.status === "error") {
            alerts.push(
              ui.Notice({
                tone: "danger",
                title: src.display_name + " 同步失败",
                message: src.last_error + "。这次失败没有改变已有数据。",
                action: ui.Button({ label: "查看", tone: "secondary", compact: true, go: "/data/sources/" + src.id }),
                apiKey: "GET /sources"
              })
            );
          } else if (src.status === "attention") {
            var notice = src.kind === "wechat_visible_web"
              ? "观察器只记录你已登录会话里真实渲染过的消息，有覆盖缺口待补。"
              : "这个来源需要你看一眼。";
            alerts.push(
              ui.Notice({
                tone: "warning",
                title: src.display_name + " 需要注意",
                message: notice,
                action: ui.Button({ label: "查看", tone: "secondary", compact: true, go: "/data/sources/" + src.id }),
                apiKey: "GET /sources"
              })
            );
          }
        });
      }

      /* ---- 最近活动 ---- */
      var activity = d.recent_activity.length
        ? ui.SectionHeader({
            title: "最近活动",
            action: ui.Button({ label: "全部", tone: "ghost", compact: true, toast: "活动全览属 P1，本次原型未画" })
          }) +
          ui.List(
            d.recent_activity.slice(0, 3).map(function (a) {
              return ui.Row({
                title: a.message,
                caption: fmt.rel(a.created_at),
                lead: '<span class="dot dot--primary" aria-hidden="true"></span>'
              });
            }),
            "GET /dashboard"
          )
        : "";

      return header + hero + action + alerts.join("") + activity;
    }
  };
})((window.Pocket = window.Pocket || {}));

    </script>
    <script>
/* ===== scripts/screens/governance.js ===== */
/* ============================================================
 * 治理 —— 单卡专注（product-spec.md §3.4 要求每次展示一张卡片）
 *
 * 这一格收编三条 owner 判断队列：治理任务 / IM 知识候选 / 官方信源候选。
 * dashboard.pending_tasks 只数了第一条，所以首页的数字取自 inbox/summary（契约 E）。
 * ============================================================ */
(function (P) {
  "use strict";

  var ui = P.ui;
  var fmt = P.fmt;

  var KIND = {
    duplicate: { label: "疑似重复", tone: "violet" },
    classify: { label: "智能分类", tone: "primary" },
    quality: { label: "质量补全", tone: "violet" },
    normalize: { label: "格式规范", tone: "primary" },
    deletion: { label: "源文件已删除", tone: "danger" },
    review: { label: "需要确认", tone: "warning" },
    knowledge: { label: "新知识候选", tone: "primary" },
    source: { label: "新信源", tone: "violet" }
  };

  var QUEUE_LABEL = {
    governance: "治理任务",
    knowledge_candidates: "知识候选",
    reliable_source_candidates: "信源候选"
  };

  function confidencePill(c) {
    if (c === undefined || c === null) return "";
    var pct = Math.round(c * 100);
    var tone = pct >= 85 ? "primary" : pct >= 65 ? "violet" : "warning";
    return ui.Pill({ label: "把握 " + pct + "%", tone: tone });
  }

  /* deletion 卡语义相反、误点代价最高，文案单独一套 */
  function deletionCard(t) {
    return ui.Card({
      apiKey: "GET /governance/tasks?status=pending",
      body:
        '<div class="stack stack--snug">' +
        '<div class="row row--wrap" style="gap:8px">' +
        ui.Pill({ label: KIND.deletion.label, tone: "danger" }) +
        ui.Pill({ label: t.source_name }) +
        "</div>" +
        '<p class="t-serif-lg">这条内容的来源已经消失</p>' +
        '<p class="t-body t-strong">' + ui.esc(t.title) + "</p>" +
        '<p class="t-muted">' + ui.esc(t.source_name) +
        " 完成了一次完整扫描，没有再找到它。盒子没有自动删除，等你决定。</p>" +
        '<div class="card card--quiet card--flat"><p class="t-muted">' +
        ui.esc(t.preview) + "</p></div>" +
        '<div class="action-bar">' +
        ui.Button({ label: "归档", tone: "danger", apiKey: "POST /governance/tasks/{task_id}/apply", toast: "已归档，可撤销" }) +
        ui.Button({ label: "继续保留", tone: "secondary", apiKey: "POST /governance/tasks/{task_id}/skip", toast: "已保留，状态不变" }) +
        "</div>" +
        '<p class="t-dim">保留后状态不变。原本已就绪的仍可被 Agent 查到；原本待确认的仍然不开放。</p>' +
        "</div>"
    });
  }

  function normalCard(t) {
    var k = KIND[t.kind] || { label: t.kind, tone: "neutral" };
    var diff =
      t.diff_before && t.diff_after
        ? ui.Diff({ before: t.diff_before, after: t.diff_after })
        : "";

    return ui.Card({
      apiKey: "GET /governance/tasks?status=pending",
      body:
        '<div class="stack stack--snug">' +
        /* ① 问题是什么 */
        '<div class="row row--wrap" style="gap:8px">' +
        ui.Pill({ label: k.label, tone: k.tone }) +
        ui.Pill({ label: QUEUE_LABEL[t.queue] || t.queue }) +
        "</div>" +
        '<p class="t-serif-lg">' + ui.esc(t.title) + "</p>" +
        /* ② 为什么这样判断 */
        '<div class="card card--quiet card--flat"><div class="stack stack--tight">' +
        '<p class="t-muted">' + ui.esc(t.reason) + "</p>" +
        '<div class="row" style="gap:8px">' + confidencePill(t.confidence) +
        ui.Pill({ label: "来自 " + t.source_name }) + "</div>" +
        "</div></div>" +
        /* ③ 建议操作与效果 */
        '<p class="t-body t-strong">建议：' + ui.esc(t.suggestion) + "</p>" +
        '<p class="t-muted">' + ui.esc(t.effect) + "</p>" +
        /* ④ 最小必要对比：只显示变化的字段 */
        diff +
        '<div class="action-bar">' +
        ui.Button({ label: "接受", apiKey: "POST /governance/tasks/{task_id}/apply", toast: "已接受，可撤销" }) +
        ui.Button({ label: "编辑后接受", tone: "secondary", go: "/governance/edit/" + t.id }) +
        "</div>" +
        ui.Button({
          label: "跳过",
          tone: "ghost",
          block: true,
          apiKey: "POST /governance/tasks/{task_id}/skip",
          toast: "已跳过，稍后还会出现"
        }) +
        "</div>"
    });
  }

  P.SCREENS.governance = {
    title: "治理",
    tab: "governance",
    kind: "tab",
    api: [
      "GET /governance/tasks?status=pending",
      "GET /governance/inbox/summary",
      "GET /governance/tasks/next"
    ],
    reads: [
      "GET /governance/inbox/summary|body.pending_total",
      "GET /governance/inbox/summary|body.by_queue.governance",
      "GET /governance/inbox/summary|body.applied_today",
      "GET /governance/tasks?status=pending|body.items[0].title",
      "GET /governance/tasks?status=pending|body.items[0].reason",
      "GET /governance/tasks?status=pending|body.items[0].suggestion",
      "GET /governance/tasks?status=pending|body.items[0].effect"
    ],

    render: function (snap) {
      var list = snap.get("GET /governance/tasks?status=pending");
      var summary = snap.get("GET /governance/inbox/summary");

      var header = ui.BrandHeader({
        eyebrow: "有限游戏 · 目标是清零",
        title: "治理",
        subtitle: "每次一张卡，只做需要你判断的那一下",
        trailing:
          '<button type="button" class="btn btn--secondary btn--compact" data-go="/governance/all">列表</button>'
      });

      if (list.state === "loading") {
        return header + ui.LoadingCards(1);
      }

      if (list.state === "error") {
        return (
          header +
          ui.Notice({
            tone: "danger",
            title: "暂时取不到治理卡片",
            message: list.detail + "。你已经处理过的判断不会丢。",
            action: ui.Button({ label: "重试", tone: "secondary", compact: true, go: "/governance" }),
            apiKey: "GET /governance/tasks?status=pending"
          })
        );
      }

      var items = list.body.items;
      if (!items.length) {
        var ready = snap.get("GET /dashboard");
        return (
          header +
          ui.EmptyState({
            symbol: "✓",
            title: "收件箱清空了",
            message:
              (ready.state === "ok" ? ready.body.ready_items : 0) +
              " 条数据已经可以被 Agent 查询。盒子会继续自动同步，有需要你判断的会再出现。",
            action: ui.Button({ label: "看看 Agent 能查到什么", tone: "secondary", go: "/data", view: "agent" }),
            apiKey: "GET /governance/inbox/summary"
          })
        );
      }

      var t = items[0];
      var s = summary.body;
      var progress = ui.Card({
        quiet: true,
        flat: true,
        apiKey: "GET /governance/inbox/summary",
        body:
          '<div class="stack stack--tight">' +
          '<div class="row row--between">' +
          '<span class="t-body t-strong">还剩 ' + s.pending_total + " 条</span>" +
          '<span class="t-muted">今天已处理 ' + s.applied_today + " 条</span>" +
          "</div>" +
          ui.Progress(
            Math.round((s.applied_today / (s.applied_today + s.pending_total)) * 100)
          ) +
          "</div>"
      });

      var card = t.kind === "deletion" ? deletionCard(t) : normalCard(t);

      var why =
        t.queue === "reliable_source_candidates"
          ? ui.Notice({
              tone: "warning",
              title: "接受这条会新建一个数据来源",
              message: "确认完会直接带你去这个来源的详情页，而不是回到下一张卡。",
              apiKey: "GET /reliable-source-candidates?status=pending"
            })
          : "";

      return header + progress + card + why;
    }
  };

  /* ---------- 全部待办列表 ---------- */

  P.SCREENS["governance/all"] = {
    title: "全部待办",
    heading: "全部待办",
    subtitle: "三条队列合在一起，按代价排序",
    tab: "governance",
    kind: "push",
    backLabel: "治理",
    api: ["GET /governance/tasks?status=pending", "GET /governance/inbox/summary"],
    reads: [
      "GET /governance/inbox/summary|body.by_queue.governance",
      "GET /governance/tasks?status=pending|body.total"
    ],

    render: function (snap) {
      var list = snap.get("GET /governance/tasks?status=pending");
      var summary = snap.get("GET /governance/inbox/summary");

      if (list.state === "loading") return ui.LoadingCards(4);
      if (list.state === "error") {
        return ui.Notice({ tone: "danger", title: "取不到列表", message: list.detail });
      }
      if (!list.body.items.length) {
        return ui.EmptyState({ title: "没有待办", message: "三条队列都清空了。" });
      }

      var s = summary.body;
      var queues = ui.Card({
        quiet: true,
        flat: true,
        apiKey: "GET /governance/inbox/summary",
        body:
          '<div class="metric-grid">' +
          ui.Metric({ value: s.by_queue.governance || 0, label: "治理任务" }) +
          ui.Metric({ value: s.by_queue.knowledge_candidates || 0, label: "知识候选" }) +
          ui.Metric({ value: s.by_queue.reliable_source_candidates || 0, label: "信源候选" }) +
          "</div>"
      });

      var rows = list.body.items.map(function (t) {
        var k = KIND[t.kind] || { label: t.kind, tone: "neutral" };
        return ui.Row({
          title: t.title,
          caption: (QUEUE_LABEL[t.queue] || t.queue) + " · " + fmt.rel(t.created_at),
          trailing: ui.Pill({ label: k.label, tone: k.tone }),
          go: "/governance"
        });
      });

      var more =
        list.body.total > list.body.items.length
          ? '<p class="t-dim">只显示了前 ' + list.body.items.length +
            " 条，共 " + list.body.total + " 条 —— 原型不做分页。</p>"
          : "";

      return queues + ui.List(rows, "GET /governance/tasks?status=pending") + more;
    }
  };

  /* ---------- 编辑后接受 ---------- */

  P.SCREENS["governance/edit"] = {
    title: "编辑后接受",
    heading: "编辑后接受",
    tab: "governance",
    kind: "push",
    backLabel: "治理",
    api: ["GET /governance/tasks?status=pending", "POST /governance/tasks/{task_id}/apply"],
    reads: ["GET /governance/tasks?status=pending|body.items[0].preview"],

    render: function (snap, route) {
      var list = snap.get("GET /governance/tasks?status=pending");
      if (list.state !== "ok" || !list.body.items.length) {
        return ui.Notice({ tone: "danger", title: "这条待办已经不在了", message: "可能已被处理。回到治理看下一条。" });
      }
      var t = null;
      list.body.items.forEach(function (x) { if (x.id === route.param) t = x; });
      if (!t) t = list.body.items[0];

      var after = t.diff_after || [];
      var titleVal = after[0] ? after[0].replace(/^标题：/, "") : t.title;
      var catVal = after[1] ? after[1].replace(/^分类：/, "") : "";
      var tagsVal = after[2] ? after[2].replace(/^标签：/, "").split(" · ") : [];

      return (
        ui.Card({
          quiet: true,
          flat: true,
          apiKey: "GET /governance/tasks?status=pending",
          body:
            '<div class="stack stack--tight">' +
            '<p class="t-label">原内容</p>' +
            '<p class="t-muted">' + ui.esc(t.preview) + "</p>" +
            "</div>"
        }) +
        ui.SectionHeader({ title: "改成这样", caption: "已按建议预填，可以直接改" }) +
        ui.Field({ value: titleVal, placeholder: "标题" }) +
        ui.Field({ value: catVal, placeholder: "分类" }) +
        '<div class="row row--wrap" style="gap:8px">' +
        tagsVal.map(function (t2) { return ui.Chip(t2, true); }).join("") +
        ui.Chip("＋ 加标签", false) +
        "</div>" +
        ui.Card({
          body:
            '<div class="stack stack--tight">' +
            '<p class="t-muted">保存后这条进入已就绪，个人 Agent 可以查询到它。</p>' +
            '<p class="t-dim">标题为空时不能保存 —— 进入已就绪前必须填写标题。</p>' +

      );

  };

    <script>
/* ===== scripts/screens/data.js ===== */
/* ============================================================
 * 数据 —— 本次 IA 改动之一：原「同步」tab 降为二级页，这一格给「我的数据现在长什么样」。
 *
 * 本屏的灵魂是双视角：`我的全部数据`（Owner，含待确认）｜`Agent 能查到的`（只有已就绪）。
 * 同一个查询词在两个视角下的**结果差，就是数据治理的价值可视化**。
 * 等式：Owner 命中数 − Agent 命中数 ＝ excluded_count，由 mock 的同一份 items 计算保证。
 * ============================================================ */
(function (P) {
  "use strict";

  var ui = P.ui;
  var fmt = P.fmt;

  var STATE_LABEL = { ready: "已就绪", needs_review: "待确认", archived: "已归档" };
  var STATE_TONE = { ready: "primary", needs_review: "warning", archived: "neutral" };

  var SOURCE_GLYPH = {
    folder: "▤",
    wechat_visible_web: "✻",
    capture: "＋",
    rss: "◈"
  };

  P.SCREENS.data = {
    title: "数据",
    tab: "data",
    kind: "tab",
    api: ["GET /items", "POST /agent/search-preview", "GET /sources", "GET /dashboard"],
    reads: [
      "GET /items|body.total",
      "GET /items|body.items[0].title",
      "GET /items|body.items[0].state",
      "GET /items|body.facets.by_state.ready",
      "GET /items|body.facets.by_state.needs_review",
      "GET /items|body.facets.by_state.archived",
      "POST /agent/search-preview|body.count",
      "POST /agent/search-preview|body.excluded_count",
      "POST /agent/search-preview|body.excluded_reasons.needs_review",
      "POST /agent/search-preview|body.excluded_reasons.im_not_opted_in",
      "GET /sources|body.items[0].display_name"
    ],

    render: function (snap, route) {
      var isAgent = route.view === "agent";
      var q = route.query || "合同";
      var items = snap.get("GET /items");
      var preview = snap.get("POST /agent/search-preview");
      var sources = snap.get("GET /sources");

      var header = ui.BrandHeader({
        eyebrow: "私有数据库 · 本地治理",
        title: "数据",
        subtitle: "盒子里有什么，Agent 能看到什么",
        trailing:
          '<button type="button" class="btn btn--secondary btn--compact" data-sheet="capture" ' +
          'aria-label="采集一段文字或链接">＋</button>'
      });

      if (items.state === "loading") return header + ui.LoadingCards(3);

      if (items.state === "error") {
        return (
          header +
          ui.Notice({
            tone: "danger",
            title: "连不上你的盒子",
            message: items.detail + "。手机不保存你的数据副本，所以这里什么都不显示。",
            action: ui.Button({ label: "检查连接", tone: "secondary", compact: true, go: "/box/connection" }),
            apiKey: "GET /items"
          })
        );
      }

      var search =
        ui.Field({
          icon: "⌕",
          value: q,
          placeholder: "搜索标题、正文或标签",
          trailing: '<span class="t-dim">回车</span>'
        }).replace('class="field__input"', 'class="field__input" data-search-field="1"');

      var segmented = ui.Segmented({
        go: "/data",
        apiKey: isAgent ? "POST /agent/search-preview" : "GET /items",
        items: [
          { id: "owner", label: "我的全部数据", selected: !isAgent, count: items.state === "ok" ? undefined : undefined },
          { id: "agent", label: "Agent 能查到的", selected: isAgent }
        ]
      });

      /* ---- 刚装好 ---- */
      if (sources.state === "ok" && sources.body.items.length === 0) {
        return (
          header +
          ui.EmptyState({
            symbol: "▤",
            title: "盒子里还没有数据",
            message: "添加一个数据来源，或者直接从手机采集一段文字。",
            action: ui.Button({ label: "添加数据来源", sheet: "add-source" }),
            apiKey: "GET /sources"
          })
        );
      }

      /* ---- 状态分布：来自 facets，与今日页的计数同源 ---- */
      var f = items.body.facets.by_state;
      var distribution = ui.Card({
        quiet: true,
        flat: true,
        apiKey: "GET /items",
        body:
          '<div class="metric-grid">' +
          ui.Metric({ value: f.ready, label: "已就绪" }) +
          ui.Metric({ value: f.needs_review, label: "待确认" }) +
          ui.Metric({ value: f.archived, label: "已归档" }) +
          "</div>"
      });

      /* ---- 双视角差值带：整个原型最能说清「治理为什么值钱」的一句话 ---- */
      var band = "";
      if (isAgent && preview.state === "ok") {
        var p = preview.body;
        if (p.excluded_count > 0) {
          var reasons = [];
          if (p.excluded_reasons.needs_review) reasons.push(p.excluded_reasons.needs_review + " 条等你确认");
          if (p.excluded_reasons.im_not_opted_in) reasons.push(p.excluded_reasons.im_not_opted_in + " 条来自未开放给 Agent 的会话");
          if (p.excluded_reasons.knowledge_unconfirmed) reasons.push(p.excluded_reasons.knowledge_unconfirmed + " 条知识候选未确认");
          band = ui.Notice({
            tone: "warning",
            title: "Agent 能查到 " + p.count + " 条",
            message: "另有 " + p.excluded_count + " 条被挡在门外：" + reasons.join("、") + "。",
            action: ui.Button({ label: "去处理", tone: "secondary", compact: true, go: "/governance" }),
            apiKey: "POST /agent/search-preview"
          });
        } else {
          band = ui.Notice({
            title: "「" + q + "」这一组已经全部治理干净",
            message: "Owner 看到的 " + items.body.total + " 条，Agent 一条不少地也能查到。",
            apiKey: "POST /agent/search-preview"
          });
        }
      }

      /* ---- 结果列表 ---- */
      var list;
      if (!items.body.items.length) {
        if (isAgent) {
          var ownerSnapCount = preview.state === "ok" ? preview.body.excluded_count : 0;
          list = ownerSnapCount
            ? ui.EmptyState({
                symbol: "⛨",
                title: "Agent 查不到「" + q + "」",
                message: "但你的数据里有 " + ownerSnapCount + " 条匹配 —— 它们还没通过治理。",
                action: ui.Button({ label: "去治理", go: "/governance" }),
                apiKey: "POST /agent/search-preview"
              })
            : ui.EmptyState({ symbol: "⌕", title: "没有匹配「" + q + "」的内容", message: "换个词试试。" });
        } else {
          list = ui.EmptyState({
            symbol: "⌕",
            title: "没有匹配「" + q + "」的内容",
            message: "换个词，或者看看下面的来源里有没有你要的东西。"
          });
        }
      } else {
        list = ui.List(
          items.body.items.map(function (it) {
            return ui.Row({
              title: it.title,
              caption:
                (it.source_name || "未知来源") + " · " + fmt.rel(it.updated_at) +
                (it.category ? " · " + it.category : ""),
              trailing: ui.Pill({ label: STATE_LABEL[it.state] || it.state, tone: STATE_TONE[it.state] }),
              go: "/data/item/" + it.id
            });
          }),
          isAgent ? "POST /agent/search-preview" : "GET /items"
        );
      }

      var count =
        '<p class="t-dim">' +
        (isAgent ? "以 Agent 的身份预览：" : "你的视角：") +
        "「" + ui.esc(q) + "」命中 " + items.body.total + " 条" +
        (isAgent ? "（只含已就绪）" : "（含待确认，不含已归档）") +
        "</p>";

      /* ---- 来源摘要（一张卡，不是列表） ---- */
      var healthy = 0, attention = 0;
      sources.body.items.forEach(function (s) {
        if (s.status === "healthy") healthy++;
        else attention++;
      });
      var sourceCard = ui.Row({
        title: sources.body.items.length + " 个数据来源",
        caption: healthy + " 个正常" + (attention ? " · " + attention + " 个需要注意" : ""),
        lead: '<span class="dot ' + (attention ? "dot--warn" : "dot--ok") + '" aria-hidden="true"></span>',
        go: "/data/sources",
        apiKey: "GET /sources"
      });

      return (
        header +
        search +
        segmented +
        band +
        count +
        list +
        distribution +
        ui.SectionHeader({ title: "数据来源", caption: "配置一次，之后盒子自己跑" }) +
        ui.List([sourceCard])
      );
    }
  };

  /* ---------- 条目详情 ---------- */

  P.SCREENS["data/item"] = {
    title: "条目详情",
    heading: "条目",
    tab: "data",
    kind: "push",
    backLabel: "数据",
    api: ["GET /items/{item_id}", "PATCH /items/{item_id}"],
    reads: [
      "GET /items/{item_id}|body.title",
      "GET /items/{item_id}|body.text_content",
      "GET /items/{item_id}|body.sources[0].source_name",
      "GET /items/{item_id}|body.sources[0].first_seen_at"
    ],

    render: function (snap) {
      var res = snap.get("GET /items/{item_id}");
      if (res.state === "loading") return ui.LoadingCards(2);
      if (res.state === "error") {
        return ui.Notice({ tone: "danger", title: "取不到这条内容", message: res.detail });
      }
      if (res.state === "empty") {
        return ui.EmptyState({ title: "这条内容不在了", message: "可能已被归档。" });
      }

      var it = res.body;
      return (
        ui.Card({
          apiKey: "GET /items/{item_id}",
          body:
            '<div class="stack stack--snug">' +
            '<div class="row row--between row--top">' +
            '<p class="t-serif-lg grow">' + ui.esc(it.title) + "</p>" +
            ui.Pill({ label: STATE_LABEL[it.state] || it.state, tone: STATE_TONE[it.state] }) +
            "</div>" +
            '<div class="row row--wrap" style="gap:8px">' +
            (it.category ? ui.Chip(it.category, true) : "") +
            (it.tags || []).map(function (t) { return ui.Chip(t, false); }).join("") +
            "</div>" +
            '<p class="t-dim">v' + it.version + " · " + fmt.rel(it.updated_at) + "更新</p>" +
            "</div>"
        }) +
        ui.SectionHeader({ title: "内容" }) +
        ui.Card({ quiet: true, flat: true, body: '<p class="t-body">' + ui.esc(it.text_content) + "</p>" }) +
        ui.SectionHeader({
          title: "来源与证据",
          caption: it.sources.length > 1 ? "同一内容在多个位置发现，已合并" : "这条内容从哪来"
        }) +
        ui.List(
          it.sources.map(function (s) {
            return ui.Row({
              title: s.source_name || "未知来源",
              caption:
                (s.origin_uri || "—") +
                " · 首次发现 " + fmt.rel(s.first_seen_at) +
                " · 最近见到 " + fmt.rel(s.last_seen_at)
            });
          }),
          "GET /items/{item_id}"
        ) +
        '<div class="action-bar">' +
        ui.Button({ label: "编辑", apiKey: "PATCH /items/{item_id}", toast: "编辑表单与治理卡共用一套" }) +
        ui.Button({ label: "归档", tone: "danger", toast: "归档后 Agent 将查不到这条内容，可在已归档里找回" }) +
        "</div>" +
        '<p class="t-dim">有待处理的治理任务时，不能绕过任务直接把状态改成已就绪。</p>'
      );
    }
  };

  /* ---------- 数据来源列表 ---------- */

  P.SCREENS["data/sources"] = {
    title: "数据来源",
    heading: "数据来源",
    subtitle: "配置一次，之后由盒子调度、重试、增量判断",
    tab: "data",
    kind: "push",
    backLabel: "数据",
    api: ["GET /sources", "POST /sources"],
    reads: [
      "GET /sources|body.items[0].display_name",
      "GET /sources|body.items[0].item_count",
      "GET /sources|body.items[0].last_sync_at"
    ],

    render: function (snap) {
      var res = snap.get("GET /sources");
      if (res.state === "loading") return ui.LoadingCards(3);
      if (res.state === "error") {
        return ui.Notice({ tone: "danger", title: "取不到来源列表", message: res.detail });
      }
      if (res.state === "empty" || !res.body.items.length) {
        return ui.EmptyState({
          symbol: "▤",
          title: "还没有数据来源",
          message: "先加一个文件夹。盒子会扫描、去重、规范化，只把治理干净的数据开放给 Agent。",
          action: ui.Button({ label: "添加数据来源", sheet: "add-source" })
        });
      }

      var rows = res.body.items.map(function (s) {
        var tone = s.status === "error" ? "dot--bad" : s.status === "attention" ? "dot--warn" : "dot--ok";
        var label = s.status === "error" ? "失败" : s.status === "attention" ? "要看一眼" : "正常";
        return ui.Row({
          title: (SOURCE_GLYPH[s.kind] || "▤") + " " + s.display_name,
          caption:
            s.item_count + " 条" +
            (s.pending_count ? " · " + s.pending_count + " 待确认" : "") +
            " · " + (s.last_error ? "上次失败" : "同步于 " + fmt.rel(s.last_sync_at)),
          lead: '<span class="dot ' + tone + '" aria-hidden="true"></span>',
          trailing: ui.Pill({
            label: label,
            tone: s.status === "error" ? "danger" : s.status === "attention" ? "warning" : "primary"
          }),
          go: "/data/sources/" + s.id
        });
      });

      return (
        ui.List(rows, "GET /sources") +
        ui.Button({ label: "添加数据来源", block: true, sheet: "add-source", apiKey: "POST /sources" })
      );
    }
  };

  /* ---------- 来源详情：走 /data/sources/{source_id}，与列表同一个屏 key ---------- */

  function renderSourceDetail(snap) {
    var res = snap.get("GET /sources/{source_id}");
    if (res.state === "loading") return ui.LoadingCards(2);
    if (res.state === "error") {
      return ui.Notice({ tone: "danger", title: "取不到来源", message: res.detail });
    }
    if (res.state === "empty") {
      return ui.EmptyState({ title: "这个来源不在了", message: "可能已被删除。" });
    }

    var s = res.body;
    var failing = s.status === "error";
    var obs = snap.get("GET /sources/{source_id}/observer-status");
    var gaps = snap.get("GET /sources/{source_id}/coverage-gaps");

    var statusCard = ui.Card({
      apiKey: "GET /sources/{source_id}",
      body:
        '<div class="stack stack--snug">' +
        '<div class="row row--between row--top">' +
        '<p class="t-serif-lg grow">' + ui.esc(s.display_name) + "</p>" +
        ui.Pill({
          label: failing ? "失败" : s.status === "attention" ? "要看一眼" : "正常",
          tone: failing ? "danger" : s.status === "attention" ? "warning" : "primary"
        }) +
        "</div>" +
        (failing
          ? '<p class="t-body">' + ui.esc(s.last_error) + "</p>" +
            '<p class="t-muted">这次失败没有改变已有数据。已连续失败 ' +
            s.consecutive_failures + " 次，下次自动重试在 " + fmt.ahead(s.next_run_at) + "。</p>"
          : '<p class="t-muted">上次同步 ' + fmt.rel(s.last_sync_at) +
            "，下次 " + fmt.ahead(s.next_run_at) + "。</p>") +
        '<div class="metric-grid">' +
        ui.Metric({ value: s.item_count, label: "条数据" }) +
        ui.Metric({ value: s.pending_count, label: "待确认" }) +
        ui.Metric({ value: s.schedule, label: "频率" }) +
        "</div></div>"
    });

    var config = ui.Card({
      quiet: true,
      flat: true,
      body:
        '<div class="stack stack--tight">' +
        '<p class="t-label">配置（在盒子上改）</p>' +
        '<p class="t-mono">' + ui.esc(s.config.path || "（无路径，由观察器提供）") + "</p>" +
        (s.config.extensions
          ? '<p class="t-dim">只收 ' + s.config.extensions.join("、") + "；其它格式计为跳过，不建条目</p>"
          : "") +
        "</div>"
    });

    var observer = "";
    if (obs.state === "ok" && obs.body) {
      var degraded = obs.body.state !== "active";
      observer =
        ui.SectionHeader({ title: "观察器", caption: "只看你已登录会话里真实渲染过的消息" }) +
        ui.Card({
          apiKey: "GET /sources/{source_id}/observer-status",
          body:
            '<div class="stack stack--snug">' +
            '<div class="row row--between">' +
            ui.Dot(degraded ? "warn" : "ok", degraded ? "解析器落后" : "运行中") +
            ui.Pill({
              label: "缺口 " + obs.body.open_gap_count,
              tone: obs.body.open_gap_count ? "warning" : "neutral"
            }) +
            "</div>" +
            '<p class="t-muted">' + ui.esc(obs.body.coverage_notice) + "</p>" +
            '<p class="t-dim">扩展 v' + obs.body.extension_version +
            " · 解析器 v" + obs.body.parser_version +
            " · 心跳 " + fmt.rel(obs.body.last_heartbeat_at) + "</p>" +
            (gaps.state === "ok" && gaps.body.items.length
              ? ui.Notice({
                  tone: "warning",
                  title: "这段时间的消息不完整",
                  message:
                    fmt.clock(gaps.body.items[0].started_at) + "–" +
                    fmt.clock(gaps.body.items[0].ended_at) +
                    "：" + gaps.body.items[0].reason + "。不要把它当成完整聊天历史。",
                  apiKey: "GET /sources/{source_id}/coverage-gaps"
                })
              : "") +
            "</div>"
        });
    }

    return (
      statusCard +
      config +
      observer +
      '<div class="action-bar">' +
      ui.Button({
        label: "立即同步",
        apiKey: "POST /sources/{source_id}/sync",
        toast: failing ? "同步失败：权限被拒绝（EACCES）" : "已开始同步"
      }) +
      ui.Button({ label: "暂停", tone: "secondary", toast: "已暂停，不再自动同步" }) +
      "</div>" +
      ui.Button({ label: "删除来源", tone: "danger", block: true, toast: "需要二次确认" }) +
      '<p class="t-dim">删除来源不会删除盒子上的原文件。已经治理好的数据会保留，' +
      "但失去最后一个来源的条目会进入治理收件箱等你决定。</p>"
    );
  }

  /* /data/sources 与 /data/sources/{source_id} 是同一个屏 key，靠 param 分岔 */
  var listRender = P.SCREENS["data/sources"].render;
  var listApi = P.SCREENS["data/sources"].api;
  var listReads = P.SCREENS["data/sources"].reads;

  P.SCREENS["data/sources"] = {
    title: "数据来源",
    heading: function (route) { return route.param ? "来源" : "数据来源"; },
    subtitle: function (route) {
      return route.param ? "它现在健不健康、还会不会自己好起来" : "配置一次，之后由盒子调度、重试、增量判断";
    },
    backLabel: "数据",
    tab: "data",
    kind: "push",
    api: listApi.concat([
      "GET /sources/{source_id}",
      "POST /sources/{source_id}/sync",
      "GET /sources/{source_id}/observer-status",
      "GET /sources/{source_id}/coverage-gaps"
    ]),
    reads: listReads.concat([
      "GET /sources/{source_id}|body.display_name",
      "GET /sources/{source_id}|body.item_count",
      "GET /sources/{source_id}|body.next_run_at"
    ]),
    render: function (snap, route) {
      if (route.param) return renderSourceDetail(snap);
      return listRender(snap, route);
    }
  };
})((window.Pocket = window.Pocket || {}));

    </script>
    <script>
/* ===== scripts/screens/box.js ===== */
/* ============================================================
 * 盒子 —— 本次 IA 改动之二：原「设置」升级更名。
 *
 * 收纳规则：凡是关于「盒子本身、怎么到达它、谁被允许读它」的，都在这一格。
 * 私有网络与 Agent 授权因此是一级概念，不是躺在设置里的可选项。
 *
 * Pocket 不做云账号 —— 个人数据底座引入第三方身份中心等于在「私有」上开洞。
 * 所谓账号实际是三件事：对盒子的持有证明、本机设备身份、已授权设备与撤销。
 * ============================================================ */
(function (P) {
  "use strict";

  var ui = P.ui;
  var fmt = P.fmt;

  var NET_STATE = {
    connected: { label: "已连接", tone: "primary", dot: "ok" },
    degraded: { label: "降级中继", tone: "warning", dot: "warn" },
    offline: { label: "离线", tone: "danger", dot: "bad" },
    not_provisioned: { label: "未启用", tone: "neutral", dot: "" }
  };

  P.SCREENS.box = {
    title: "盒子",
    tab: "box",
    kind: "tab",
    api: [
      "GET /box/status",
      "GET /network/status",
      "GET /mobile/devices",
      "GET /agent/clients",
      "GET /governance/inbox/summary"
    ],
    reads: [
      "GET /box/status|body.display_name",
      "GET /box/status|body.version",
      "GET /box/status|body.storage.data_root_label",
      "GET /box/status|body.storage.free_bytes",
      "GET /box/status|body.scheduler.next_run_at",
      "GET /box/status|body.backup.last_backup_at",
      "GET /network/status|body.state",

      var cells = CELLS.map(function (c, i) {
        /* 每格造一份自己的 route，再据此取快照 —— 带 param 的格子才会显示对的那一条 */
        var r = {
          path: cellPath(c),
          key: c.key,
          param: c.param || null,
          tab: (P.SCREENS[c.key] || {}).tab || null,
          scenario: route.scenario,
          view: c.view || "owner",
          query: "",
          api: route.api,
          sheet: c.sheet || null,
          frame: false,
          tools: false
        };
        var s = P.data(route.scenario, r);
        var def = P.SCREENS[c.key];
        var inner = "";

        if (def.kind === "push") {
          var heading = typeof def.heading === "function" ? def.heading(r) : def.heading || def.title;
          var subtitle = typeof def.subtitle === "function" ? def.subtitle(r) : def.subtitle;
          inner += ui.BackBar({ title: heading, subtitle: subtitle, label: def.backLabel });
        }
        inner += def.render(s, r);

        var sheetLayer = "";
        if (c.sheet && P.SHEETS[c.sheet]) {
          var sh = P.SHEETS[c.sheet];
          sheetLayer =
            '<div class="mini-sheet">' +
            '<div class="sheet__grabber"><span></span></div>' +
            '<div class="sheet__head"><span class="sheet__title">' + ui.esc(sh.title) + "</span>" +
            '<span class="sheet__close">关闭</span></div>' +
            '<div class="mini-stage mini-stage--sheet">' + sh.render(s, r) + "</div>" +
            "</div>";
        }

        var go = c.view
          ? ' data-go="' + cellPath(c) + '" data-view="' + c.view + '"'
          : c.sheet
            ? ' data-go="' + cellPath(c) + '" data-sheet="' + c.sheet + '"'
            : ' data-go="' + cellPath(c) + '"';

        /* 注意：这里必须用 div，不能用 span/button 包块级内容 ——
           <span> 遇到块级子元素会被解析器提前闭合，屏内容会被抬出缩放容器，
           整面墙就变成一堆没缩放的碎片。 */
        return (
          '<div class="wall-cell">' +
          '<div class="wall-cell__viewport" role="button" tabindex="0"' + go +
          ' aria-label="打开' + ui.esc(c.label) + '">' +
          '<div class="mini-device" data-mini="' + i + '">' +
          '<div class="mini-stage">' + inner + "</div>" +
          (P.SCREENS[c.key].chrome ? "" : miniTabbar(r.tab)) +
          sheetLayer +
          "</div></div>" +
          '<div class="wall-cell__label">' + ui.esc(c.label) + "</div>" +
          '<div class="wall-cell__api">' + ui.esc(cellApis(c) || "—") + "</div>" +
          "</div>"
        );
      });

      return head + '<div class="wall-grid">' + cells.join("") + "</div>";
    }
  };

  /* 渲染后按格子实际宽度缩放 —— 用 transform 不用 zoom，保住 390 这个前提 */
  P.scaleWall = function () {
    var vps = document.querySelectorAll(".wall-cell__viewport");
    Array.prototype.forEach.call(vps, function (vp) {
      var mini = vp.querySelector(".mini-device");
      if (mini) mini.style.transform = "scale(" + vp.clientWidth / 390 + ")";
    });
  };

  window.addEventListener("resize", function () {
    if (P.route && P.route.key === "wall") P.scaleWall();
  });
})((window.Pocket = window.Pocket || {}));

    <script>
/* ===== scripts/devtools.js ===== */
/* ============================================================
 * devtools.js —— 场景切换器 ＋ 接口视图浮层
 *
 * 接口标注的第三层：登记表（endpoints.js）→ DOM 上 data-api → 这里画角标与接口卡。
 * 角标按 auth 分色：Owner Claude 橙、Agent kraft 赭 —— 一眼看出这块数据谁能读。
 * 未登记的标注直接 console.error，截图脚本会因此失败：标注是有测试保护的产物。
 * ============================================================ */
(function (P) {
  "use strict";

  var ui = P.ui;

  P.paintApiBadges = function () {
    var nodes = document.querySelectorAll("#stage [data-api], #sheet [data-api], .mini-stage [data-api]");
    Array.prototype.forEach.call(nodes, function (el) {
      var key = el.getAttribute("data-api");
      var def = P.ENDPOINTS[key];
      if (!def) console.error("[api] 未登记的端点标注：" + key);
      if (el.querySelector(":scope > .api-badge")) return;

      var b = document.createElement("button");
      b.type = "button";
      b.className = "api-badge";
      b.dataset.key = key;
      if (def) {
        b.dataset.auth = def.auth;
        b.textContent = def.method + " " + def.path.split("?")[0];
        if (def.status === "proposed") b.textContent += " ·待提供";
        if (def.status === "change") b.textContent += " ·需改";
      } else {
        b.dataset.missing = "1";
        b.textContent = "未登记：" + key;
      }
      el.appendChild(b);
    });
  };

  var STATUS_LABEL = {
    ready: "契约已存在，可直接调",
    proposed: "待盒子程序提供（本原型逼出来的）",
    change: "已存在但必须改"
  };

  var AUTH_LABEL = {
    owner: "Owner token",
    owner_or_device: "Owner token 或已配对设备",
    agent: "Agent Bearer（与 Owner token 不可互换）",
    device: "配对设备会话",
    collector: "采集器 token"
  };

  P.openApiCard = function (key) {
    var def = P.ENDPOINTS[key];
    var card = document.getElementById("api-card");
    if (!def) {
      card.innerHTML =
        '<div class="api-card__panel"><p class="notice__title">未登记的端点</p>' +
        '<p class="t-muted">' + ui.esc(key) + '</p>' +
        '<button type="button" class="btn btn--secondary" data-close-api="1">关闭</button></div>';
      card.hidden = false;
      return;
    }

    var snap = P.data(P.route.scenario, P.route);
    var res = snap.raw(key);
    var rows = [];
    rows.push(["认证", AUTH_LABEL[def.auth] || def.auth]);
    rows.push(["状态", STATUS_LABEL[def.status] || def.status]);
    if (def.headers && def.headers.length) rows.push(["必需头", def.headers.join("、")]);
    if (def.returns) rows.push(["返回", def.returns]);
    if (def.errors && def.errors.length) {
      rows.push([
        "失败码",
        def.errors.map(function (e) { return e.code + "：" + e.when; }).join("；")
      ]);
    }
    if (def.doc) rows.push(["文档", def.doc]);

    var body =
      '<div class="row row--between"><span class="api-card__route">' +
      ui.esc(def.method + " " + def.path) + "</span></div>" +
      '<div class="api-card__grid">' +
      rows
        .map(function (r) {
          return (
            '<span class="api-card__key">' + ui.esc(r[0]) + "</span>" +
            '<span class="api-card__val">' + ui.esc(r[1]) + "</span>"
          );
        })
        .join("") +
      "</div>" +
      (def.note ? '<p class="t-muted">' + ui.esc(def.note) + "</p>" : "") +
      (def.body
        ? '<p class="t-label">请求体</p><pre class="api-card__pre">' +
          ui.esc(JSON.stringify(def.body, null, 2)) + "</pre>"
        : "") +
      '<p class="t-label">当前场景（' + ui.esc(P.route.scenario) + "）下的响应</p>" +
      '<pre class="api-card__pre">' + ui.esc(JSON.stringify(res, null, 2)) + "</pre>" +
      '<button type="button" class="btn btn--secondary btn--block" data-close-api="1">关闭</button>';

    card.innerHTML = '<div class="api-card__panel">' + body + "</div>";
    card.hidden = false;
  };

  /* ---------- 工具条 ---------- */

  P.syncDevtools = function (route) {
    var sel = document.querySelector("[data-scenario-select]");
    if (sel && !sel.dataset.filled) {
      sel.dataset.filled = "1";
      sel.innerHTML = P.SCENARIOS.map(function (s) {
        return '<option value="' + s.id + '">' + s.label + "</option>";
      }).join("");
      sel.addEventListener("change", function () {
        P.go(P.route.path, { scenario: sel.value });
      });
    }
    if (sel) sel.value = route.scenario;

    var toggle = document.querySelector("[data-api-toggle]");
    if (toggle && !toggle.dataset.bound) {
      toggle.dataset.bound = "1";
      toggle.addEventListener("change", function () {
        P.go(P.route.path, { api: toggle.checked });
      });
    }
    if (toggle) toggle.checked = route.api;
  };
})((window.Pocket = window.Pocket || {}));

    </script>

    <script>
/* ===== scripts/app.js ===== */
/* ============================================================
 * app.js —— hash 路由 + 渲染循环 + 自检
 *
 * tab／二级页／sheet／mock 场景／接口视图全部编码进 URL：
 *   #/data?scenario=backlog&view=agent&api=1
 * 这样每一屏都可深链、可分享、可截图、可复现 —— 截图脚本靠 goto 穷举，不靠点击。
 * ============================================================ */
(function (P) {
  "use strict";

  var ui = P.ui;

  function parseHash() {
    var raw = location.hash.slice(1) || "/today";
    var i = raw.indexOf("?");
    var path = i < 0 ? raw : raw.slice(0, i);
    var q = new URLSearchParams(i < 0 ? "" : raw.slice(i + 1));
    var seg = path.split("/").filter(Boolean);

    var hit = resolveScreen(seg);
    var tabIds = P.TABS.map(function (t) { return t.id; });
    var def = P.SCREENS[hit.key] || {};

    return {
      path: "/" + seg.join("/"),
      key: hit.key,
      param: hit.param,
      tab: def.tab || (tabIds.indexOf(seg[0]) >= 0 ? seg[0] : null),
      scenario: q.get("scenario") || "normal",
      view: q.get("view") || "owner",
      query: q.get("query") || "",
      api: q.get("api") === "1",
      sheet: q.get("sheet") || null,
      frame: q.get("frame") !== "0",
      tools: q.get("tools") !== "0"
    };
  }

  function resolveScreen(seg) {
    for (var n = seg.length; n >= 1; n--) {
      var key = seg.slice(0, n).join("/");
      if (P.SCREENS[key]) return { key: key, param: seg[n] || null };
    }
    return { key: "today", param: null };
  }

  function buildHash(path, o) {
    var q = new URLSearchParams();
    if (o.scenario && o.scenario !== "normal") q.set("scenario", o.scenario);
    if (o.view && o.view !== "owner") q.set("view", o.view);
    if (o.query) q.set("query", o.query);
    if (o.api) q.set("api", "1");
    if (o.sheet) q.set("sheet", o.sheet);
    if (!o.frame) q.set("frame", "0");
    if (!o.tools) q.set("tools", "0");
    var s = q.toString();
    return "#" + path + (s ? "?" + s : "");
  }

  P.go = function (path, opts) {
    var r = P.route || parseHash();
    var next = {
      scenario: r.scenario,
      view: r.view,
      query: r.query,
      api: r.api,
      sheet: null,
      frame: r.frame,
      tools: r.tools
    };
    Object.keys(opts || {}).forEach(function (k) { next[k] = opts[k]; });
    location.hash = buildHash(path || r.path, next);
  };

  P.back = function () {
    if (history.length > 1) history.back();
    else P.go("/today");
  };

  P.toast = function (message, actionLabel) {
    var slot = document.getElementById("toast-slot");
    slot.innerHTML =
      '<div class="toast" role="status">' +
      "<span>" + ui.esc(message) + "</span>" +
      (actionLabel ? '<span class="toast__action">' + ui.esc(actionLabel) + "</span>" : "") +
      "</div>";
    if (P._toastTimer) clearTimeout(P._toastTimer);
    P._toastTimer = setTimeout(function () { slot.innerHTML = ""; }, 2600);
  };

  /* ---------- tab bar ---------- */

  function renderTabbar(route, snap) {
    var bar = document.getElementById("tabbar");
    var def = P.SCREENS[route.key] || {};
    /* chrome 非空（full / wall）的屏都不套手机底栏 */
    if (def.chrome) {
      bar.hidden = true;
      document.querySelector(".home-indicator").hidden = true;
      return;
    }
    bar.hidden = false;
    document.querySelector(".home-indicator").hidden = false;

    var summary = snap.get("GET /governance/inbox/summary");
    var pending = summary.state === "ok" && summary.body ? summary.body.pending_total : 0;

    bar.innerHTML = P.TABS.map(function (t) {
      var current = route.tab === t.id;
      var badge =
        t.id === "governance" && pending
          ? '<span class="tabbar__badge">' + (pending > 99 ? "99+" : pending) + "</span>"
          : "";
      return (
        '<button type="button" class="tabbar__item"' +
        (current ? ' aria-current="page"' : "") +
        ' data-go="' + t.path + '">' +
        '<span class="tabbar__glyph" aria-hidden="true">' + t.glyph + "</span>" +
        badge +
        '<span class="tabbar__label">' + t.label + "</span>" +
        "</button>"
      );
    }).join("");
  }

  /* ---------- 渲染 ---------- */

  function render() {
    var route = (P.route = parseHash());
    var body = document.body;
    body.dataset.tab = route.tab || "";
    body.dataset.scenario = route.scenario;
    body.dataset.api = route.api ? "1" : "0";
    body.dataset.sheet = route.sheet || "";
    body.dataset.frame = route.frame ? "1" : "0";
    body.dataset.tools = route.tools ? "1" : "0";
    body.dataset.rendered = "0";
    body.dataset.chrome = (P.SCREENS[route.key] || {}).chrome || "";

    var snap = P.data(route.scenario, route);
    var def = P.SCREENS[route.key] || P.SCREENS.today;

    var head = "";
    if (def.kind === "push") {
      var heading = typeof def.heading === "function" ? def.heading(route) : def.heading || def.title;
      var subtitle = typeof def.subtitle === "function" ? def.subtitle(route) : def.subtitle;
      head = ui.BackBar({ title: heading, subtitle: subtitle, label: def.backLabel });
    }

    var stage = document.getElementById("stage");
    stage.innerHTML = head + def.render(snap, route);
    stage.scrollTop = 0;

    var sheetEl = document.getElementById("sheet");
    if (route.sheet && P.SHEETS[route.sheet]) {
      var s = P.SHEETS[route.sheet];
      sheetEl.hidden = false;
      sheetEl.innerHTML =
        '<div class="sheet__grabber"><span></span></div>' +
        '<div class="sheet__head"><span class="sheet__title">' + ui.esc(s.title) + "</span>" +
        '<button type="button" class="sheet__close" data-close-sheet="1">关闭</button></div>' +
        '<div class="sheet__body">' + s.render(snap, route) + "</div>";
    } else {
      sheetEl.hidden = true;
      sheetEl.innerHTML = "";
    }

    renderTabbar(route, snap);
    document.getElementById("api-card").hidden = true;

    if (route.key === "wall" && P.scaleWall) P.scaleWall();
    if (P.paintApiBadges) P.paintApiBadges();
    if (P.syncDevtools) P.syncDevtools(route);
    selfCheck(route, snap, def);
    if (route.sheet && P.SHEETS[route.sheet]) {
      selfCheck(route, snap, Object.assign({ title: "sheet:" + route.sheet }, P.SHEETS[route.sheet]));
    }

    document.title = (def.title || "Pocket") + " · CentaurAI Pocket";
    body.dataset.rendered = "1";
  }

  P.render = render;

  /* ---------- 自检：七条断言，全部走 console.error，截图脚本会因此失败 ---------- */

  function resolvePath(obj, path) {
    var cur = obj;
    var parts = path.split(".");
    for (var i = 0; i < parts.length; i++) {
      if (cur === null || cur === undefined) return undefined;
      var p = parts[i];
      var m = p.match(/^(\w+)\[(\d+)\]$/);
      if (m) {
        cur = cur[m[1]];
        if (!Array.isArray(cur)) return undefined;
        cur = cur[Number(m[2])];
      } else {
        cur = cur[p];
      }
    }
    return cur;
  }

  function selfCheck(route, snap, def) {
    var errs = [];

    /* ② SCREENS[].api 的 key 必须同时在 ENDPOINTS 与 mock 里 */
    (def.api || []).forEach(function (k) {
      if (!P.ENDPOINTS[k]) errs.push("屏「" + def.title + "」声明了未登记的端点：" + k);
      if (P.MOCK_KEYS.indexOf(k) < 0) errs.push("屏「" + def.title + "」的端点没有 mock：" + k);
    });

    /* ③ 反向：mock 不得造出 ENDPOINTS 里没有的接口 */
    if (!P._mockChecked) {
      P._mockChecked = true;
      P.MOCK_KEYS.forEach(function (k) {
        if (!P.ENDPOINTS[k]) errs.push("mock 造出了未登记的端点：" + k);
      });
      Object.keys(P.ENDPOINTS).forEach(function (k) {
        if (P.MOCK_KEYS.indexOf(k) < 0) errs.push("已登记端点缺少 mock：" + k);
      });
    }

    /* ⑥ reads：屏声明自己真正读到的字段路径，断言它们在**参照快照**里不是 undefined。
       专门堵「mock 漏字段」——渲染出空白、没有报错、截图看着还挺像。
       断言只对 normal 打，因为 empty/backlog 这些场景的字段缺失是刻意的。 */
    var ref = P.data("normal", route);
    (def.reads || []).forEach(function (spec) {
      var idx = spec.indexOf("|");
      var key = spec.slice(0, idx);
      var path = spec.slice(idx + 1);
      var res = ref.raw(key);
      if (!res) {
        errs.push("reads 指向没有 mock 的端点：" + key);
        return;
      }
      if (resolvePath(res, path) === undefined) {
        errs.push("屏「" + def.title + "」在 normal 场景读不到字段：" + key + " → " + path);
      }
    });

    /* ④⑤ 布局断言在下一帧量，避免读到未布局的 0 */
    requestAnimationFrame(function () {
      var stage = document.getElementById("stage");
      /* 用 stage 的实际内容宽（clientWidth 减自身左右内边距），不写死 390 ——
         否则换个视口宽度、或者到了联览墙那种整窗布局上，会整片误报 */
      var scs = getComputedStyle(stage);
      var maxW =
        stage.clientWidth - parseFloat(scs.paddingLeft) - parseFloat(scs.paddingRight);
      Array.prototype.forEach.call(stage.querySelectorAll("*"), function (el) {
        /* 联览墙的格子是刻意缩放并裁切的预览面，不参与手机屏的几何断言 */
        if (el.closest(".mini-device")) return;
        if (el.scrollWidth > maxW + 1 && !el.closest(".api-card__pre") && !el.closest(".diff")) {
          if (getComputedStyle(el).overflowX === "visible") {
            console.error("[selfCheck] 横向溢出：", el.className || el.tagName, el.scrollWidth);
          }
        }
      });
      Array.prototype.forEach.call(
        stage.querySelectorAll("button.btn, .tabbar__item, .list__row, .backbar, .segmented__item"),
        function (el) {
          if (el.closest(".mini-device")) return;
          if (el.offsetHeight > 0 && el.offsetHeight < 32) {
            console.error("[selfCheck] 触控目标过小：", el.className, el.offsetHeight);
          }
        }
      );

      /* ⑦ 纵向静默裁切：overflow:hidden 的容器被压小后会吞掉内容且不报任何错。
         这是本原型踩过的真实坑（flex 子元素默认可收缩 + .list 的 overflow:hidden）。 */
      Array.prototype.forEach.call(stage.querySelectorAll("*"), function (el) {
        if (el.closest(".mini-device")) return;
        var cs = getComputedStyle(el);
        if (cs.overflowY !== "hidden") return;
        if (el.scrollHeight > el.clientHeight + 1) {
          console.error(
            "[selfCheck] 内容被纵向裁掉：",
            el.className || el.tagName,
            el.clientHeight + " < " + el.scrollHeight
          );
        }
      });
    });

    errs.forEach(function (e) { console.error("[selfCheck] " + e); });
  }

  /* ---------- 事件委托 ---------- */

  document.addEventListener("click", function (e) {
    var t = e.target;

    var badge = t.closest(".api-badge");
    if (badge) {
      e.preventDefault();
      e.stopPropagation();
      if (P.openApiCard) P.openApiCard(badge.dataset.key);
      return;
    }

    if (t.closest("#api-card") && !t.closest(".api-card__panel")) {
      document.getElementById("api-card").hidden = true;
      return;
    }
    var apiClose = t.closest("[data-close-api]");
    if (apiClose) {
      document.getElementById("api-card").hidden = true;
      return;
    }

    var el = t.closest("[data-go],[data-back],[data-sheet],[data-close-sheet],[data-toast],[data-view],[data-query]");
    if (!el) return;
    e.preventDefault();

    if (el.dataset.back === "1") { P.back(); return; }
    if (el.dataset.closeSheet === "1") { P.go(P.route.path, { sheet: null }); return; }
    if (el.dataset.toast) { P.toast(el.dataset.toast); return; }

    var opts = {};
    if (el.dataset.sheet) opts.sheet = el.dataset.sheet;
    if (el.dataset.view) opts.view = el.dataset.view;
    if (el.dataset.query !== undefined && el.dataset.query !== null) opts.query = el.dataset.query;
    P.go(el.dataset.go || P.route.path, opts);
  });

  document.addEventListener("submit", function (e) { e.preventDefault(); });

  document.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && e.target.classList.contains("field__input") && e.target.dataset.searchField) {
      e.preventDefault();
      P.go(P.route.path, { query: e.target.value });
    }
  });

  window.addEventListener("hashchange", render);
  document.addEventListener("DOMContentLoaded", render);
  if (document.readyState !== "loading") render();
})((window.Pocket = window.Pocket || {}));

    </script>
  </body>
</html>
